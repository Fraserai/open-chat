name: OpenChat
options:
  bundleIdPrefix: au.openchat
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    APP_URL: https://your-deployment.example
    PRODUCT_ID: au.openchat.app.plus.monthly
targets:
  OpenChat:
    type: application
    platform: iOS
    sources: [OpenChat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.openchat.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenChat/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OpenChat/Info.plist
      properties:
        CFBundleDisplayName: Open Chat
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        APP_URL: $(APP_URL)
        PRODUCT_ID: $(PRODUCT_ID)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  OpenChat:
    build:
      targets:
        OpenChat: all
    run:
      config: Debug
